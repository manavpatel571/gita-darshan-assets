name: Daily YouTube Shorts Publisher

on:
  schedule:
    - cron: '30 4 * * *'  # 10:00 AM IST
    - cron: '30 13 * * *' # 7:00 PM IST
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        # Since we use ImageMagick for moviepy TextClip, we need to install it in Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<!-- <policy domain="path" rights="none" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml
          sudo sed -i 's/<\/policymap>/<\/policymap> -->/g' /etc/ImageMagick-6/policy.xml || true
          cd youtube_automation
          pip install -r requirements.txt
          
      - name: Setup YouTube Credentials
        env:
          CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          cd youtube_automation
          mkdir -p credentials
          echo "$CLIENT_SECRET_JSON" > credentials/client_secret.json
          echo "$TOKEN_JSON" > credentials/token.json
          
      - name: Run Video Generation & Upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd youtube_automation
          python main.py
          
      - name: Commit updated history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube_automation/history.json
          git commit -m "Update history.json [skip ci]" || echo "No changes to commit"
          git push
